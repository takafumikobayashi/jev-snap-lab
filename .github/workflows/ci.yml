name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 上流の Jev は呼ばない。E2E はブラウザ側でリクエストを差し替えるため、
# API キーもコストも要らない。CITY は既定の架空データで走る。
env:
  CI: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm run check

      - name: Lint と整形
        run: pnpm run lint

      - name: ユニットテストと contract テスト
        run: pnpm run test

      - name: ドキュメントの参照
        run: node scripts/check-docs.mjs

      - name: 秘密情報の検査
        run: node scripts/check-secrets.mjs

      - name: ビルド
        run: pnpm run build

      - name: クライアントバンドルに API キーが無いこと
        run: |
          if grep -rq "TYPESAFE_API_KEY" .vercel/output/static/; then
            echo "静的出力に TYPESAFE_API_KEY が含まれている" >&2
            exit 1
          fi
          echo "静的出力: API キーの混入なし"

      - name: Playwright のブラウザを取得
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm run test:e2e

      - name: 失敗時のレポート
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
